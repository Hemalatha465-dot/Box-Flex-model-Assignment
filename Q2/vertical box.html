<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical Box</title>

  <style>
    .box {
      width: 350px;
      height: 600px;
      padding: 20px;
      background-color: #dcd8ee;
      margin: auto;
      border-radius: 20px;
      text-align: center;
    }
    .inner {
      width: 250px;
      height: 100px;
      background-color: white;
      padding: 15px;
      margin: 27px auto;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 22px;
      color: #333;
    }

    .inner b {
      font-weight: 700;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Highest & <br> Average CTC</h2>

    <div class="inner">
      Exponential Increase in <br> Salary Potential <br> 
      <b>60%</b>
    </div>

    <div class="inner">
      Average CTC <br>
      <b>₹6.1 LPA</b>
    </div>

    <div class="inner">
      Highest CTC <br>
      <b>₹36 LPA</b>
    </div>

  </div>

</body>
</html>
