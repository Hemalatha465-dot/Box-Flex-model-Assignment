<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase Box</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .product-container {
            width: 500px;
            height: 600px;
            background-color: white;
             padding: 30px; 
            margin: 10px;
            border: 3px solid grey;
            border-radius: 15px; 
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; 
            box-sizing: border-box; 
            text-align: center;
        }
        .product-image {
            max-width: 100%;
            max-height: 70%;
            height: auto;
            display: block;
            object-fit: contain; 
            margin-bottom: 20px;
        }
        .product-name {
            font-size: 1.8em;
            margin-bottom: 10px;
            font-weight: bold; 
            color: #333;
        }
        .product-description {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        .buy-now-button {
            background-color: black;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            width: 80%;
            transition: background-color 0.3s;
        }
        
        .buy-now-button:hover {
            background-color: #333;
        }

    </style>
</head>
<body>

    <div class="product-container">
        
        <img src="https://rukminim2.flixcart.com/image/612/612/xif0q/smartwatch/w/x/h/-original-imahfa7xspmxemvj.jpeg" alt="SAMSUNG Galaxy Watch6 LTE" class="product-image">
        <h3 class="product-name">SAMSUNG Galaxy Watch6 LTE</h3>
        
        <p class="product-description">
            Graphite Strap, 44mm. Latest smartwatch with health tracking features, AMOLED display, and long battery life.
        </p>
        
        <button class="buy-now-button">Buy Now</button>
        
    </div>

</body>
</html>
