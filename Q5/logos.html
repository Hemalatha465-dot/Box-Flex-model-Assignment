<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masai Hiring Partners Layout</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .main-content {
            width: 95%;
            max-width: 1400px; 
            margin: 40px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 50px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start; 
            gap: 5px;
            margin-bottom: 10px;
        }

        .logo-item {
            flex-basis: calc(10% - 4.5px);
            flex-grow: 0;
            flex-shrink: 0;    
            height: 100px;
            border: 1px solid #eee;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
        }
        .logo-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
           opacity: 1;
            transition: none;
        }

    </style>
</head>
